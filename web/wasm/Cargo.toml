[package]
name = "solver-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "puzz.link URL solver + difficulty rating (sudoku / yajilin / slitherlink / nurikabe / akari)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
npgen = { path = "../../vendor/npgenerator/rust" }
yajilin-kit = { path = "../../kits/yajilin-kit/rust" }
nurikabe-kit = { path = "../../kits/nurikabe-kit/rust" }
slitherlink-kit = { path = "../../kits/slitherlink-kit/rust" }
akari-kit = { path = "../../kits/akari-kit/rust" }
masyu-kit = { path = "../../kits/masyu-kit/rust" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
